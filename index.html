<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Libro de Gastos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F5F1E8; --paper2:#EFE9DB; --ink:#242F27; --ink-soft:#5B6459;
    --line:#D6CDB8; --income:#2F6F4E; --expense:#A63D2F; --accent:#9C7A3C;
    --focus:#1F6FEB;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:inherit;}
  html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%;}
  body{
    height:100%; margin:0; background:var(--paper); color:var(--ink);
    font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#1B1F1A; --paper2:#20251F; --ink:#EDE7D8; --ink-soft:#A6A08F;
      --line:#3A4038; --income:#5FBE8C; --expense:#E27A63; --accent:#D4B26A;
    }
  }
  :root[data-theme="dark"]{
    --paper:#1B1F1A; --paper2:#20251F; --ink:#EDE7D8; --ink-soft:#A6A08F;
    --line:#3A4038; --income:#5FBE8C; --expense:#E27A63; --accent:#D4B26A;
  }
  .wrap{max-width:760px; margin:0 auto; padding:40px 24px 80px;}
  header{display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:12px; border-bottom:2px solid var(--ink); padding-bottom:18px; margin-bottom:28px;}
  h1{font-family:'Lora',serif; font-weight:600; font-size:28px; margin:0; letter-spacing:.2px;}
  h1 em{font-style:italic; color:var(--accent);}
  select, input, button, textarea{font-family:inherit; font-size:15px;}
  #monthPicker{background:none; border:1px solid var(--line); color:var(--ink); padding:8px 10px; border-radius:3px;}
  #monthPicker:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible{outline:2px solid var(--focus); outline-offset:2px;}

  .summary{display:flex; border:1px solid var(--line); border-radius:4px; overflow:hidden; margin-bottom:32px;}
  .stat{flex:1; padding:16px 18px; border-right:1px solid var(--line);}
  .stat:last-child{border-right:none;}
  .stat .label{font-size:12px; color:var(--ink-soft); margin-bottom:6px;}
  .stat .amount{font-family:'IBM Plex Mono',monospace; font-size:22px; font-weight:600;}
  .stat.income .amount{color:var(--income);}
  .stat.expense .amount{color:var(--expense);}

  form#entryForm{display:grid; grid-template-columns:auto 1fr 1fr auto; gap:10px; margin-bottom:36px; align-items:end;}
  .field{display:flex; flex-direction:column; gap:5px;}
  .field label{font-size:12px; color:var(--ink-soft);}
  .field input, .field select{padding:9px 10px; border:1px solid var(--line); border-radius:3px; background:var(--paper2); color:var(--ink); width:100%;}
  .toggle{display:flex; border:1px solid var(--line); border-radius:3px; overflow:hidden; height:38px;}
  .toggle button{flex:1; border:none; background:var(--paper2); color:var(--ink-soft); cursor:pointer; padding:0 12px; font-weight:500;}
  .toggle button.active[data-type="ingreso"]{background:var(--income); color:var(--paper);}
  .toggle button.active[data-type="gasto"]{background:var(--expense); color:var(--paper);}
  #addBtn{grid-column:span 4; margin-top:2px; background:var(--ink); color:var(--paper); border:none; border-radius:3px; padding:11px; font-weight:600; cursor:pointer;}
  #addBtn:hover{opacity:.9;}

  section h2{font-family:'Lora',serif; font-size:17px; font-weight:600; margin:0 0 14px;}
  .entries{border-top:1px solid var(--line); margin-bottom:40px;}
  .entry{display:grid; grid-template-columns:70px 1fr auto auto; gap:14px; align-items:center; padding:11px 0; border-bottom:1px solid var(--line);}
  .entry .date{font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--ink-soft);}
  .entry .desc strong{display:block; font-size:14px;}
  .entry .desc span{font-size:12px; color:var(--ink-soft);}
  .entry .amt{font-family:'IBM Plex Mono',monospace; font-weight:600; white-space:nowrap;}
  .entry .amt.ingreso{color:var(--income);}
  .entry .amt.gasto{color:var(--expense);}
  .entry .del{background:none; border:none; color:var(--ink-soft); cursor:pointer; font-size:15px; padding:4px 8px;}
  .entry .del:hover{color:var(--expense);}
  .empty{padding:20px 0; color:var(--ink-soft); font-style:italic;}

  .bar-row{margin-bottom:12px;}
  .bar-row .top{display:flex; justify-content:space-between; font-size:13px; margin-bottom:5px;}
  .bar-row .track{height:8px; background:var(--paper2); border-radius:4px; overflow:hidden;}
  .bar-row .fill{height:100%; background:var(--accent); border-radius:4px;}

  @media (max-width:560px){
    form#entryForm{grid-template-columns:1fr 1fr;}
    .toggle{grid-column:span 2;}
    #addBtn{grid-column:span 2;}
    .entry{grid-template-columns:56px 1fr auto; }
    .entry .del{grid-column:3; justify-self:end;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Libro de <em>Gastos</em></h1>
    <input type="month" id="monthPicker">
  </header>

  <div class="summary">
    <div class="stat income"><div class="label">Ingresos del mes</div><div class="amount" id="totalIncome">$0</div></div>
    <div class="stat expense"><div class="label">Gastos del mes</div><div class="amount" id="totalExpense">$0</div></div>
    <div class="stat"><div class="label">Balance</div><div class="amount" id="totalBalance">$0</div></div>
  </div>

  <form id="entryForm">
    <div class="field" style="grid-column:span 1">
      <label>Tipo</label>
      <div class="toggle">
        <button type="button" data-type="gasto" class="active">Gasto</button>
        <button type="button" data-type="ingreso">Ingreso</button>
      </div>
    </div>
    <div class="field"><label for="desc">Descripción</label><input id="desc" placeholder="Ej. Mercado" required></div>
    <div class="field"><label for="cat">Categoría</label>
      <select id="cat">
        <option>Comida</option><option>Transporte</option><option>Vivienda</option>
        <option>Servicios</option><option>Salud</option><option>Ocio</option>
        <option>Educación</option><option>Otros</option>
      </select>
    </div>
    <div class="field"><label for="amt">Monto</label><input id="amt" type="number" step="0.01" min="0" placeholder="0" required></div>
    <input type="hidden" id="date">
    <button type="submit" id="addBtn">Agregar registro</button>
  </form>

  <section>
    <h2>Movimientos del mes</h2>
    <div class="entries" id="entries"></div>
  </section>

  <section>
    <h2>Gastos por categoría</h2>
    <div id="breakdown"></div>
  </section>
</div>

<script>
const STORAGE_KEY = 'libroGastos.entries';
let entries = [];
try { entries = JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; } catch(e) { entries = []; }

const monthPicker = document.getElementById('monthPicker');
const now = new Date();
monthPicker.value = now.toISOString().slice(0,7);

let currentType = 'gasto';
document.querySelectorAll('.toggle button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    currentType = btn.dataset.type;
    document.querySelectorAll('.toggle button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
  });
});

document.getElementById('entryForm').addEventListener('submit', e=>{
  e.preventDefault();
  const desc = document.getElementById('desc').value.trim();
  const cat = document.getElementById('cat').value;
  const amt = parseFloat(document.getElementById('amt').value);
  if(!desc || !amt || amt<=0) return;
  const [year, month] = monthPicker.value.split('-').map(Number);
  const today = new Date();
  let day = today.getFullYear()===year && (today.getMonth()+1)===month ? today.getDate() : 1;
  const date = `${year}-${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
  entries.push({ id: Date.now(), date, type: currentType, desc, cat, amt });
  save();
  document.getElementById('desc').value='';
  document.getElementById('amt').value='';
  render();
});

function save(){
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(entries)); }
  catch(e){ console.error('No se pudo guardar', e); }
}

function deleteEntry(id){
  entries = entries.filter(en=>en.id!==id);
  save();
  render();
}

function currentMonthEntries(){
  const ym = monthPicker.value;
  return entries.filter(en=>en.date.slice(0,7)===ym);
}

function money(n){
  return '$' + n.toLocaleString('es-CO', {maximumFractionDigits:0});
}

function render(){
  const list = currentMonthEntries().sort((a,b)=>b.date.localeCompare(a.date) || b.id-a.id);
  const income = list.filter(e=>e.type==='ingreso').reduce((s,e)=>s+e.amt,0);
  const expense = list.filter(e=>e.type==='gasto').reduce((s,e)=>s+e.amt,0);
  document.getElementById('totalIncome').textContent = money(income);
  document.getElementById('totalExpense').textContent = money(expense);
  document.getElementById('totalBalance').textContent = money(income-expense);

  const container = document.getElementById('entries');
  container.innerHTML = '';
  if(list.length===0){
    container.innerHTML = '<div class="empty">Sin movimientos este mes. Agrega el primero arriba.</div>';
  } else {
    list.forEach(en=>{
      const div = document.createElement('div');
      div.className = 'entry';
      const d = new Date(en.date+'T00:00:00');
      const dateLabel = d.toLocaleDateString('es-CO', {day:'2-digit', month:'short'});
      div.innerHTML = `
        <div class="date">${dateLabel}</div>
        <div class="desc"><strong>${escapeHtml(en.desc)}</strong><span>${escapeHtml(en.cat)}</span></div>
        <div class="amt ${en.type}">${en.type==='gasto'?'-':'+'}${money(en.amt)}</div>
        <button class="del" aria-label="Eliminar" data-id="${en.id}">✕</button>
      `;
      container.appendChild(div);
    });
    container.querySelectorAll('.del').forEach(btn=>{
      btn.addEventListener('click', ()=>deleteEntry(Number(btn.dataset.id)));
    });
  }

  const gastos = list.filter(e=>e.type==='gasto');
  const byCat = {};
  gastos.forEach(e=>{ byCat[e.cat] = (byCat[e.cat]||0) + e.amt; });
  const maxCat = Math.max(1, ...Object.values(byCat));
  const bd = document.getElementById('breakdown');
  bd.innerHTML = '';
  const sorted = Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  if(sorted.length===0){
    bd.innerHTML = '<div class="empty">Aún no hay gastos registrados este mes.</div>';
  } else {
    sorted.forEach(([cat, total])=>{
      const pct = Math.round((total/maxCat)*100);
      const row = document.createElement('div');
      row.className = 'bar-row';
      row.innerHTML = `
        <div class="top"><span>${escapeHtml(cat)}</span><span>${money(total)}</span></div>
        <div class="track"><div class="fill" style="width:${pct}%"></div></div>
      `;
      bd.appendChild(row);
    });
  }
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

monthPicker.addEventListener('change', render);
render();
</script>
</body>
</html>
